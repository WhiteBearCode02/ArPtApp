# Project-wide Gradle settings.
# For more details on how to configure your build, visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
org.gradle.parallel=true

# AndroidX libraries are used instead of the legacy support libraries.
android.useAndroidX=true

# Kotlin code style for the project.
kotlin.code.style=official

# Enables namespacing of each library's R class.
android.nonTransitiveRClass=true

# Suppress warnings about unsupported project options
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL

# Performance optimization for library constraints
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# Java Home path
org.gradle.java.home=C\:/Program Files/Java/jdk-17.0.2
